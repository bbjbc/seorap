<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a33"/>
      <stop offset="1" stop-color="#15151a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- 배경: 둥근 다크 사각형 (이 부분은 유지) -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="57.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- 글리프: scripts/gen-icons.ts 가 assets/icon-glyph.png 를 data URI 로 넣어준다 -->
  <g filter="url(#shadow)">
    <!--GLYPH-->
  </g>
</svg>
