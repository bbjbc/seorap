name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit

  test:
    name: Functional tests (Electron)
    runs-on: windows-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 클립보드·창을 실제로 띄우는 테스트다. 예전에는 흔들려서 continue-on-error 로 덮어
      # 두었는데, 그 탓에 실제 경쟁 조건이 오래 방치됐다. 지금은 고정 sleep 대신 조건을
      # 기다리므로 실패하면 진짜 회귀로 보고 빌드를 막는다.
      - run: npm test

  build:
    name: Package (unpacked)
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npx electron-builder --win --dir --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: seorap-win-unpacked
          path: dist/win-unpacked
          retention-days: 7
