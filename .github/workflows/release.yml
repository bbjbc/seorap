name: Release

# 태그를 푸시하면 설치 파일과 포터블 exe를 빌드해 GitHub Release에 올린다.
#   git tag v1.0.0 && git push origin v1.0.0
# package.json의 version과 태그가 다르면 실패한다.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG != package.json version $PKG"; exit 1
          fi

      - run: npm ci
      - run: npm run check
      - run: npm run compile

      - name: Build installers
        run: npx electron-builder --win --publish never

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 서랍 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
